# yaml-language-server: $schema=https://spec.openapis.org/oas/3.0/schema/2021-09-28
openapi: 3.0.3
info:
  title: Web App API
  version: 1.0.0
  description: 博客应用 API

servers:
  - url: http://localhost:8080/api/v1

paths:
  # 认证（登录/注册）
  /auth:
    post:
      summary: 邮箱验证码认证
      description: 使用邮箱+验证码进行认证，无需区分注册和登录
      tags:
        - 认证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 认证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  # 创建对话（后端维护消息，返回 uuid）
  /conversations:
    get:
      summary: 获取用户对话列表
      description: 返回当前用户的 conversation_id 列表
      tags:
        - 聊天
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 对话 id 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
    post:
      summary: 新建对话
      description: 创建一条新对话，返回 conversation_id，后续发 chat 时带上此 id
      tags:
        - 聊天
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCreated'

  # 获取指定对话的消息
  /conversations/{conversation_id}:
    get:
      summary: 获取对话消息
      description: 返回指定对话的历史消息，用于打开已有对话
      tags:
        - 聊天
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 消息列表（OpenAI 格式，含 role、content 等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessages'
        '404':
          description: 对话不存在或不属于当前用户

  # 聊天 API
  /chat:
    post:
      summary: 聊天对话
      description: 与 AI 对话，需先 POST /conversations 取得 conversation_id，再带 conversation_id 与 content 请求
      tags:
        - 聊天
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: 流式响应
          content:
            text/event-stream:
              schema:
                type: string

  # 评论相关 API
  /posts:
    post:
      summary: 创建评论
      tags:
        - 评论
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: 评论创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: "post created"

    get:
      summary: 获取评论列表
      description: 通过博客文件名获取该博客的所有评论
      tags:
        - 评论
      parameters:
        - name: file
          in: query
          required: true
          schema:
            type: string
          description: 博客文件名，如 blogs/post.md
          example: "blogs/post.md"
      responses:
        '200':
          description: 评论列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    AuthRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          description: 邮箱
          example: "user@example.com"
        code:
          type: string
          description: 验证码
          example: "123456"

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: 认证令牌
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    CreatePostRequest:
      type: object
      required:
        - file
        - content
      properties:
        file:
          type: string
          description: 博客文件名
          example: "blogs/hello-world.md"
        content:
          type: string
          description: 评论内容
          example: "这是一条评论"

    ChatRequest:
      type: object
      required:
        - conversation_id
        - content
      properties:
        conversation_id:
          type: string
          description: 对话 id（由 POST /conversations 返回）
        content:
          type: string
          description: 本条用户消息

    ConversationCreated:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: 对话 uuid

    ConversationList:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
          description: 对话 id 列表
        titles:
          type: object
          additionalProperties:
            type: string
          description: 对话 id 到标题的映射，无标题的对话无此项

    ConversationMessages:
      type: array
      description: 消息列表，每项为 OpenAI 消息格式（含 role、content 等）
      items:
        type: object

    Post:
      type: object
      properties:
        id:
          type: string
          example: 1
        file:
          type: string
          description: 博客文件名
          example: "blogs/post.md"
        content:
          type: string
          description: 评论内容
          example: "这是一条评论"
        email:
          type: string
          format: email
          description: 邮箱
          example: "user@example.com"
        created_at:
          type: string
          format: date-time
          description: 创建时间
